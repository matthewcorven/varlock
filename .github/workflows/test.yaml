name: CI test suite
on:
  pull_request:
  push:


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Full suite on Linux; proof-only on Windows/macOS
          - os: ubuntu-latest
            full_suite: true
          - os: windows-latest
            full_suite: false
          - os: macos-latest
            full_suite: false

    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install js deps (w/ bun)
        run: bun install
      - name: Enable turborepo build cache
        uses: rharkor/caching-for-turbo@v2.3.11

      # Full lint/build/test suite on Linux only
      - name: ESLint
        if: ${{ matrix.full_suite }}
        run: bun run lint
      - name: Build libraries
        if: ${{ matrix.full_suite }}
        run: bun run build:libs
      - name: Run tests
        if: ${{ matrix.full_suite }}
        run: bun run test:ci

      # Build libraries on non-Linux platforms to support proof:dotnet
      - name: Build libraries (non-Linux)
        if: ${{ !matrix.full_suite }}
        run: bun run build:libs

      # .NET proof runs on all platforms
      - name: Run .NET proof slice
        run: bun run proof:dotnet
