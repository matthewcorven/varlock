phases:
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [918, 983]
  items:
    - id: phase-0
      owner: Picard
      title: design and repository preparation
      workstreams:
        - merge the proposal or equivalent upstream design artifact
        - define package boundaries and naming
        - define the stable machine-readable CLI contract
        - decide executable distribution for .NET consumers
      exit_criteria:
        - executable distribution specimen is designed tightly enough to avoid ad hoc environment setup
        - machine-readable contract fixtures are specified for success and failure
        - support-matrix ledger structure exists even if not all rows are proven yet
    - id: phase-1
      owner: Data
      title: core bridge and C# generation
      workstreams:
        - add lang=cs support to type generation
        - create Varlock.DotNet
        - create Varlock.Extensions.Configuration
        - create Varlock.MSBuild
        - prove with console, ASP.NET MVC, and WinForms examples
      exit_criteria:
        - C# generation specimen exists and passes binder validation
        - executable distribution specimen works for local development and CI
        - contract fixtures back low-level bridge tests
        - console, ASP.NET MVC, and WinForms examples prove direct and provider-based usage
    - id: phase-2
      owner: Data
      title: hosted app maturity
      workstreams:
        - create Varlock.Extensions.Hosting
        - add worker service support
        - add IOptionsSnapshot<T> and IOptionsMonitor<T> reload tests
        - add optional and reloadOnChange behavior coverage
      exit_criteria:
        - watch and reload specimen exists and demonstrates atomic reload plus last-known-good behavior
        - hosted examples prove IOptions<T>, IOptionsSnapshot<T>, and IOptionsMonitor<T> semantics
        - dotnet watch and IDE-driven workflows are documented from observed behavior
    - id: phase-3
      owner: O'Brien
      title: logging and wider platform coverage
      workstreams:
        - create Varlock.Serilog
        - add Azure Functions isolated example
        - add Blazor Server example
        - add public-config-only Blazor WebAssembly example
      exit_criteria:
        - security-boundary specimen exists and makes the Serilog versus non-Serilog distinction concrete
        - Azure Functions isolated, Blazor Server, and Blazor WebAssembly examples prove their caveats and supported flows
        - support-matrix rows are filled for every v1 support claim
    - id: phase-4
      owner: Picard
      title: native evolution and plugin expansion
      workstreams:
        - re-evaluate native .NET parser/runtime cost-benefit
        - expand .NET-native plugin capabilities if justified
        - consider Roslyn analyzer/source generator enhancements
      exit_criteria:
        - native evolution is justified by demonstrated CLI bridge limits rather than speculative parity concerns
        - any expanded plugin or analyzer scope is documented as a new support contract

