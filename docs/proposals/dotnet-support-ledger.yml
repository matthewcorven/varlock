version: 1
initiative:
  id: dotnet-support
  title: Varlock .NET support execution ledger
  proposal_path: docs/proposals/dotnet-support.md
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [25, 1266]
  purpose: >-
    Keep implementation traceable to the proposal by recording owners, phases,
    support claims, proof artifacts, example apps, CI coverage, and deferrals.
  update_rules:
    - Update this ledger whenever a .NET support claim, proof artifact, phase gate, caveat, or deferral changes.
    - Do not move any proof_status from planned to proven until the linked example app and automated test exist, or the ledger explains why one proof form is not applicable.
    - Use proposal line references from this ledger when creating issues, planning work, and reviewing PRs.
    - Keep `clause_rows.items` synchronized with proposal headings, lists, and support-matrix data rows so every proposal clause has a stable ledger ID.

owners:
  Picard: architecture, phase gates, support-claim acceptance, and native-runtime or analyzer go/no-go decisions
  Data: CLI bridge, configuration provider, hosting helpers, options semantics, and reload behavior
  Geordi: C# type generation, MSBuild integration, IDE/build behavior, and analyzer evolution
  Tuvok: machine-readable contracts, diagnostics, security/redaction boundaries, and plugin semantics
  O'Brien: executable distribution, examples, support-matrix proof, CI/release, and documentation
  Ralph: phase-gate completeness, blocker detection, and proof-status pressure

parity_buckets:
  - id: engine-parity
    owner: Data
    reviewer: Picard
    phase: phase-1
    proof_status: planned
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [29, 42]
    requirements:
      - schema discovery and loading
      - imports and environment-specific source handling
      - validation and coercion
      - resolver execution
      - plugin-backed loading through the CLI bridge
      - sensitive/public metadata
      - deterministic type-generation inputs derived from schema metadata rather than resolved environment state
      - machine-readable source and item metadata exposed through the serialized bridge contract
  - id: dotnet-native-parity
    owner: Picard
    supporting_owners: [Data, Geordi, Tuvok, O'Brien]
    phase: phase-3
    proof_status: planned
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [44, 56]
    requirements:
      - IConfiguration integration
      - IOptions<T>, IOptionsSnapshot<T>, and IOptionsMonitor<T>
      - build-time C# generation
      - MSBuild integration
      - mainstream hosted and non-hosted .NET workflows
      - supported .NET logging and redaction ergonomics
  - id: deferred-javascript-specific-parity
    owner: Picard
    phase: phase-4
    proof_status: deferred
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [57, 70]
    deferred_items:
      - JavaScript runtime bootstrap injection behavior
      - framework-specific build-time injection surfaces comparable to Vite or Next.js
      - non-Serilog global process output redaction
      - HTTP response interception and leak prevention equivalent to current JS runtime patches
      - any .NET equivalent of varlock run unless intentionally designed and shipped
      - any .NET equivalent of varlock scan unless intentionally designed and shipped

product_surfaces:
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [72, 85]
  mapping:
    - id: surface-load
      owner: Data
      phase: phase-1
      status: supported
      details: varlock load is supported through the machine-readable CLI bridge and exposed through Varlock.DotNet plus configuration-provider packages.
    - id: surface-typegen
      owner: Geordi
      phase: phase-1
      status: supported
      details: varlock typegen is supported for .NET through lang=cs in the existing type-generation flow.
    - id: surface-plugin-backed-resolution
      owner: Tuvok
      phase: phase-1
      status: supported-through-cli-bridge-only
      details: plugin-backed resolution is supported only through the documented CLI bridge executable and plugin discovery model.
    - id: surface-run
      owner: Data
      phase: phase-4
      status: deferred-low-level-helper-only
      details: no separate .NET process-wrapper command in v1; a low-level child-process environment injection helper is optional.
    - id: surface-scan
      owner: Tuvok
      phase: phase-4
      status: cli-only
      details: no .NET-native wrapper package in v1; repository and CI workflows use the existing varlock scan CLI directly.
    - id: surface-js-runtime-patching
      owner: Picard
      phase: phase-4
      status: unsupported
      details: JavaScript runtime bootstrap injection and runtime patching stay unsupported unless intentionally designed and shipped.

product_positioning:
  owner: Picard
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [87, 117]
  default_stance:
    - appsettings remains supported
    - Varlock integrates through IConfiguration
    - Varlock participates in IOptions<T>, IOptionsSnapshot<T>, and IOptionsMonitor<T>
    - Varlock overrides appsettings values by default when the same key exists
  migration_modes:
    - coexistence mode
    - Varlock-primary mode
  docs_split:
    appsettings:
      - non-secret defaults
      - structured application config
      - feature flags
      - UI defaults
    varlock:
      - secrets
      - environment-specific settings
      - external secret resolution
      - validated/coerced values
      - AI-safe schema exposure

platforms_and_workflows:
  owner: O'Brien
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [118, 161]
  compatibility_goals:
    - Core shared packages target netstandard2.0 unless a concrete dependency requires netstandard2.1.
    - Host-specific convenience layers may multi-target newer frameworks where useful.
  required_workflows:
    - HostApplicationBuilder and WebApplicationBuilder
    - ASP.NET Core MVC and minimal API startup flows
    - dotnet run, dotnet watch, and IDE-driven debug launches
    - Visual Studio and Rider design-time builds
    - User Secrets coexistence
    - legacy ConfigurationManager/App.config/Web.config migration guidance where claimed
    - Azure Functions isolated worker local behavior with local.settings.json
    - Blazor Server and Blazor WebAssembly public-config-only flows
  runtime_caveat:
    - Blazor WebAssembly support is build-time generation plus non-sensitive public config only.
    - Typed public config is supported there, but the server-side CLI bridge runtime model is not.

packages:
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [278, 430]
  items:
    - id: varlock-dotnet
      owner: Data
      phase: phase-1
      status: planned
      target_frameworks: [netstandard2.0]
      purpose:
        - base runtime bridge to the CLI
        - shared DTOs and metadata model
        - load/resolve orchestration
        - public low-level APIs for non-hosted and legacy apps
    - id: varlock-extensions-configuration
      owner: Data
      phase: phase-1
      status: planned
      target_frameworks: [netstandard2.0]
      purpose:
        - IConfigurationSource
        - IConfigurationProvider
        - change token integration
        - optional startup and reload behavior
    - id: varlock-extensions-hosting
      owner: Data
      phase: phase-2
      status: planned
      target_frameworks: [netstandard2.0]
      purpose:
        - convenience helpers for ASP.NET Core and Generic Host
        - service registration
        - optional status and diagnostics services
    - id: varlock-source-generation
      owner: Geordi
      phase: phase-1
      status: planned
      target_frameworks: [netstandard2.0]
      purpose:
        - generate strongly typed C# from Varlock schema
        - optionally add analyzers later
    - id: varlock-msbuild
      owner: Geordi
      phase: phase-1
      status: planned
      purpose:
        - build-time type generation
        - optional build-time validation
        - incremental build wiring
    - id: varlock-serilog
      owner: Tuvok
      phase: phase-3
      status: planned
      target_frameworks: [netstandard2.0]
      purpose:
        - Serilog-specific redaction helpers
        - redaction-aware destructuring and enrichment
    - id: varlock-dotnet-plugins
      owner: Tuvok
      phase: phase-4
      status: experimental
      purpose:
        - future .NET-native plugin authoring model
        - CLI plugin behavior remains the supported path in v1

core_contracts:
  architecture:
    owner: Data
    reviewer: Picard
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [162, 277]
    preserve_exactly:
      - file discovery and precedence
      - environment-specific source handling
      - validation and coercion semantics
      - sensitive/public metadata
      - serialized graph contract and machine-readable bridge output semantics
      - type-generation determinism from schema metadata rather than resolved environment state
      - redaction and leak-prevention settings semantics
      - resolver behavior
      - plugin behavior exposed through CLI execution
      - supported plugin discovery and loading semantics for the chosen executable distribution model
    expose_via_dotnet_idioms:
      - IConfiguration
      - IConfigurationProvider
      - IOptions<T>
      - IOptionsSnapshot<T>
      - IOptionsMonitor<T>
      - source generation
      - MSBuild
      - Serilog hooks
    bridge_requirements:
      - consume only machine-readable CLI output
      - treat varlock load --format json-full as the stable machine contract
      - version the payload shape intentionally
      - never parse human-readable CLI output
      - preserve actionable schema and resolution diagnostics
      - define stable machine-readable error categories and exit semantics
      - preserve file/line/column where available
      - define fast-fail version skew handling between packages and the executable
    executable_acquisition:
      - explicit application configuration path
      - package-managed executable path
      - development-only PATH discovery in documented opt-in mode
  configuration_provider:
    owner: Data
    phase: phase-2
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [432, 523]
    requirements:
      - precedence order is appsettings, appsettings.{Environment}, Varlock, then explicit late overrides
      - optional=true and reloadOnChange=false starts empty and stays empty until next startup
      - optional=true and reloadOnChange=true starts empty and activates on later successful load
      - reloadOnChange watches the root schema and all active loaded source files
      - reloads are explicitly debounced and coalesced
      - only one reload is active at a time
      - successful reloads swap configuration atomically
      - failed reloads keep the last known good state
      - watched files are recomputed from the last successful load
      - dotnet watch and generated-file behavior are documented from real observed behavior
  options_and_typed_access:
    owner: Data
    phase: phase-2
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [524, 618]
    requirements:
      - support user-authored options, generated options, and mixed usage
      - IOptionsSnapshot<T> changes become visible only after successful config swap
      - IOptionsMonitor<T>.OnChange fires only after successful reload
      - failed reloads do not mutate CurrentValue
      - typed access is led by provider integration plus binder-friendly generated POCOs
      - direct access remains secondary but explicit for console, WinForms, and small utilities
      - hosted guidance explicitly recommends ValidateOnStart()
  logging_security_plugins_diagnostics:
    owner: Tuvok
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [619, 728]
    requirements:
      - Varlock.Serilog is first-class in v1
      - RedactLogs is supported only through Serilog integration points and explicit low-level helpers
      - PreventLeaks metadata does not imply automatic patching of process output, HTTP responses, or framework response objects
      - there is no .NET-native varlock scan in v1
      - there is no supported non-Serilog global process output redaction mechanism in v1
      - existing Varlock CLI plugin behavior works through the CLI bridge for supported executable layouts
      - plugin packaging, discovery, supported layouts, and failure behavior are documented explicitly
      - diagnostics preserve actionable file and location metadata
      - the .NET debugging path is documented, including when to invoke raw varlock scan
  type_generation_and_msbuild:
    owner: Geordi
    proposal_refs:
      - path: docs/proposals/dotnet-support.md
        lines: [683, 756]
    requirements:
      - extend the existing @generateTypes flow with lang=cs
      - keep generation schema-driven and deterministic
      - support generated output paths safe for MSBuild and obj/
      - preserve imported-schema and auto=false semantics
      - generate C# during build
      - optionally validate schema during build
      - use incremental inputs and outputs
      - write generated files into obj/Varlock/
      - surface failures as normal MSBuild diagnostics

support_matrix:
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [786, 828]
  app_types:
    - id: claim-console-direct-runtime
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet console bridge check
      caveat: non-hosted and uses low-level APIs instead of IConfiguration
      proof_status: proven
    - id: claim-aspnet-provider
      example: examples/dotnet-aspnet-mvc-net8/
      test: bun run proof:dotnet ASP.NET provider check
      caveat: startup-only provider ordering over appsettings; options binding and reload remain out of slice
      proof_status: proven
    - id: claim-worker-monitor
      example: examples/dotnet-worker-net8/
      test: worker IOptionsMonitor<T> reload test
      caveat: proves long-lived reload behavior
      proof_status: planned
    - id: claim-functions-isolated
      example: examples/dotnet-functions-isolated-net8/
      test: functions isolated startup smoke test
      caveat: documents coexistence with local.settings.json
      proof_status: planned
    - id: claim-winforms-legacy
      example: examples/dotnet-winforms-net48/
      test: legacy desktop bridge smoke test
      caveat: minimum supported legacy target stays explicit
      proof_status: planned
    - id: claim-blazor-server
      example: examples/dotnet-blazor-server-net8/
      test: blazor server hosting smoke test
      caveat: proves server-side config access only
      proof_status: planned
    - id: claim-blazor-wasm-public
      example: examples/dotnet-blazor-wasm-net8-public/
      test: wasm public-config build validation test
      caveat: proves sensitive values do not cross the public boundary
      proof_status: planned
  developer_experience:
    - id: dx-dotnet-run
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet console bridge check
      caveat: proven from the checked-in example working directory through built-in repo-local development lookup to packages/varlock/bin/cli.js
      proof_status: proven
    - id: dx-repo-local-executable-lookup
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet console bridge check
      caveat: proves the default example working-directory walk-up to packages/varlock/bin/cli.js without an explicit ExecutablePath
      proof_status: proven
    - id: dx-package-local-executable-lookup
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet package-local wrapper check
      caveat: a checked-in proof-only harness drops node_modules/varlock/bin/cli.js into the example at test time and asserts that branch runs before local node_modules/.bin/varlock and repo-local fallback
      proof_status: proven
    - id: dx-local-bin-executable-lookup
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet local-bin wrapper check
      caveat: a checked-in proof-only harness drops node_modules/.bin/varlock into the example at test time and asserts that branch runs before repo-local fallback when the package-local layout is absent
      proof_status: proven
    - id: dx-path-executable-lookup
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet path lookup check
      caveat: an env-guarded proof-only harness prepends a temporary CLI entry to PATH and sets VARLOCK_DOTNET_PROOF_FORCE_PATH_LOOKUP=1 so the example disables local lookup only for that proof run
      proof_status: proven
    - id: dx-dotnet-watch
      example: examples/dotnet-aspnet-mvc-net8/
      test: watch and reload coalescing test
      caveat: proves no pathological rebuild loops
      proof_status: planned
    - id: dx-ide-build
      example: examples/dotnet-console-net8/ + examples/dotnet-aspnet-mvc-net8/
      test: bun run proof:dotnet explicit dotnet build check
      caveat: proves clean MSBuild compilation for the checked-in startup/runtime examples only; watch, generated-file loops, and IntelliSense observations remain planned
      proof_status: proven
    - id: dx-user-secrets
      example: examples/dotnet-aspnet-mvc-net8/
      test: bun run proof:dotnet ASP.NET user-secrets coexistence check
      caveat: WebApplicationBuilder loads User Secrets before AddVarlock(...), so User Secrets-only keys survive while Varlock overrides overlapping keys by provider order
      proof_status: proven
    - id: dx-local-settings
      example: examples/dotnet-functions-isolated-net8/
      test: Azure Functions config layering test
      caveat: functions-specific only
      proof_status: planned
    - id: dx-options-binding
      example: examples/dotnet-aspnet-mvc-net8/
      test: options binding test
      caveat: covers user-authored and generated POCOs where supported
      proof_status: planned
    - id: dx-options-snapshot
      example: examples/dotnet-aspnet-mvc-net8/
      test: snapshot reload test
      caveat: request-scoped semantics stay explicit
      proof_status: planned
    - id: dx-options-monitor
      example: examples/dotnet-worker-net8/
      test: monitor reload test
      caveat: proves last-known-good preservation
      proof_status: planned
    - id: dx-csharp-generation
      example: examples/dotnet-aspnet-mvc-net8/
      test: bun run proof:dotnet generated-type binder check
      caveat: proof now covers checked-in fixture parity plus example-backed generation and binder validation; MSBuild-automated generation remains planned under P2-B1
      proof_status: proven
    - id: dx-serilog-redaction
      example: examples/dotnet-aspnet-mvc-net8/
      test: bun run proof:dotnet ASP.NET --serilog-proof check
      caveat: Serilog-specific destructuring redaction only; exact case-sensitive key matches inside {@obj} are redacted to [REDACTED], `WithVarlockMetadata(graph)` adds metadata only, and scalar params remain raw
      proof_status: proven
    - id: dx-non-serilog-fallback
      example: examples/dotnet-console-net8/
      test: bun run proof:dotnet console redaction-helper check
      caveat: manual per-value redaction helper only; helper output uses [REDACTED] with exact case-sensitive key matching, and raw console output is unchanged unless the helper is called
      proof_status: proven
    - id: dx-plugin-backed-resolution
      example: "none (deferred)"
      test: "plugin failure handling proven in BridgeContractAlignmentTests.cs"
      caveat: "positive plugin-backed .NET example deferred beyond v1; pending real-world project adoption and CI integration story"
      proof_status: "deferred-v1"
    - id: dx-webappbuilder-addvarlock
      example: examples/dotnet-aspnet-mvc/
      test: dotnet test packages/dotnet/Varlock.DotNet.Tests/Varlock.DotNet.Tests.csproj (HostingExtensionsTests)
      caveat: available on net10.0 only; thin delegation to builder.Configuration.AddVarlock() with no new semantics; .NET 10 multi-target is implementation detail until CI proves it explicitly
      proof_status: proven
    - id: dx-env-static-load
      example: none (specimen pending under DX-A2a)
      test: dotnet test packages/dotnet/Varlock.DotNet.Tests/Varlock.DotNet.Tests.csproj (EnvStaticApiTests)
      caveat: convenience façade over VarlockCliRuntime for non-hosted/simple scenarios; not the recommended default path until a proving specimen exists; no caching, singleton, or DI semantics
      proof_status: proven
    - id: dx-machine-readable-errors
      example: none
      test: bridge contract fixture tests
      caveat: fixture payloads are the primary proof artifact and include a shared location-bearing schema-invalid parse-error envelope consumed by both CLI and .NET tests
      proof_status: proven
  maintenance_rules:
    - every user-facing support claim maps to at least one ledger row
    - every row identifies the proving example app, the proving automated test, or a written non-applicable reason
    - caveats remain in the ledger after a row is proven
    - removed claims are deleted or marked intentionally deferred rather than left stale

dx_overhaul_kickoff:
  proposal_refs:
    - path: docs/proposals/dotnet-dx-overhaul.md
      lines: [29, 110]
    - path: docs/proposals/dotnet-dx-overhaul-proof-plan.md
      lines: [1, 26]
  lanes:
    - id: dx-a1-baseline-shadow
      owner: O'Brien
      control_lane: DX-A1
      shadow_lane: DX-X1
      example: examples/dotnet-console/
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
        - examples/dotnet-console/dotnet-console.csproj targets net10.0 with Microsoft.Extensions.Hosting and Varlock.Extensions.Configuration project references
        - examples/dotnet-console/Program.cs is a single-file top-level statements app using Host.CreateApplicationBuilder + builder.Configuration.AddVarlock() to load config through IConfiguration
        - examples/dotnet-console/.env.schema contains the narrow string/number/boolean schema used by the baseline (no sensitive, no plugins, no advanced decorators)
        - examples/dotnet-console/.env provides safe committed values so dotnet run works from the directory without setup
        - examples/dotnet-console/README.md explicitly scopes what the example proves and what it does not claim
      proof_artifacts:
        - scripts/test-dotnet-proof.ts asserts exact resolved values (APP_NAME=varlock-console, HTTP_PORT=4310, FEATURE_ENABLED=True), provider type (VarlockConfigurationProvider), and schema path (.env.schema)
        - proof exercises repo-local, package-local, local .bin, and opt-in PATH executable discovery against the baseline example
        - dotnet build produces bin/Debug/net10.0/dotnet-console.dll
        - bun run proof:dotnet exits 0 with all baseline assertions passing
      caveats:
        - the scaffold targeting net10.0 does not widen supported target-framework claims on its own; the supported TFM boundary is governed by the support matrix and CI proof
    - id: dx-b1-webappbuilder
      owner: Data
      control_lane: DX-B1
      shadow_lane: DX-X1
      example: examples/dotnet-aspnet-mvc/
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
        - packages/dotnet/Varlock.Extensions.Hosting/VarlockWebApplicationBuilderExtensions.cs provides two overloads of WebApplicationBuilder.AddVarlock() guarded by #if NET10_0_OR_GREATER
        - packages/dotnet/Varlock.Extensions.Hosting/Varlock.Extensions.Hosting.csproj multi-targets netstandard2.0;net10.0 with FrameworkReference Microsoft.AspNetCore.App on net10.0
        - packages/dotnet/Varlock.DotNet.Tests/HostingExtensionsTests.cs proves overload count and delegation behavior
      proof_artifacts:
        - dotnet test packages/dotnet/Varlock.DotNet.Tests/Varlock.DotNet.Tests.csproj passes HostingExtensionsTests
      caveats:
        - WebApplicationBuilder extensions are available only on net10.0; the netstandard2.0 target of the hosting package does not expose them
        - this is thin delegation to builder.Configuration.AddVarlock() with no new semantics; the .NET 10 multi-target is implementation detail, not a public support claim, until CI proves it explicitly
        - the existing HostApplicationBuilder overloads remain the documented default until proof and docs agree on the broader story
    - id: dx-b3-env-load
      owner: Data
      control_lane: DX-B3
      shadow_lane: DX-X1
      example: none
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
        - packages/dotnet/Varlock.DotNet/Env.cs provides static Load() (3 sync overloads) and LoadAsync() (2 async overloads)
        - packages/dotnet/Varlock.DotNet.Tests/EnvStaticApiTests.cs proves default-option, configured-option, and async parity
      proof_artifacts:
        - dotnet test packages/dotnet/Varlock.DotNet.Tests/Varlock.DotNet.Tests.csproj passes EnvStaticApiTests
      caveats:
        - pure sugar over VarlockCliRuntime with no caching, singleton, or DI semantics
        - not the recommended default path for hosted applications; use AddVarlock() on HostApplicationBuilder or WebApplicationBuilder instead
        - not docs-ready as a recommended onboarding path until a proving specimen (direct-load example) exists and DX-X1 syncs the claim

    - id: dx-a2a-sibling-batch
      owner: O'Brien
      control_lane: DX-A2a
      shadow_lane: DX-X1
      example: examples/dotnet-console-*/
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
        - examples/dotnet-console-direct-load/ demonstrates Env.Load() static convenience without IConfiguration or DI
        - examples/dotnet-console-sensitive/ demonstrates sensitive value handling and redaction metadata
        - examples/dotnet-console-reload/ demonstrates configuration reload-on-change behavior
        - examples/dotnet-console-serilog/ demonstrates Serilog integration with VarlockConfigMetadata for log redaction
        - examples/dotnet-console-typed-config/ demonstrates generated typed configuration binding with IOptions<T>
      proof_artifacts:
        - all five sibling example directories exist and are buildable
        - bun run proof:dotnet exercises examples with proof hooks
      caveats:
        - individual examples may have varying levels of automated proof coverage
        - sibling examples demonstrate feature stories beyond the baseline but do not widen supported claims without explicit DX-X1 sync
    - id: dx-b2-metapackage
      owner: Data
      control_lane: DX-B2
      shadow_lane: DX-X1
      example: none
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
        - packages/dotnet/Varlock/Varlock.csproj is a dependency-only metapackage with IncludeBuildOutput=false and ProjectReference to Varlock.DotNet, Varlock.Extensions.Configuration, Varlock.Extensions.Hosting, and Varlock.MSBuild
        - packages/dotnet/Varlock/README.md documents bundled packages, install command, and deliberate Serilog exclusion
      proof_artifacts:
        - dotnet build packages/dotnet/Varlock/Varlock.csproj succeeds with 0 warnings
      caveats:
        - Varlock.Serilog is deliberately excluded as an opt-in dependency
        - Varlock.SourceGeneration is excluded because it is pulled transitively by Varlock.MSBuild
        - this is a project-local metapackage; NuGet publishing is a separate concern
    - id: dx-b4-di-registration
      owner: Data
      control_lane: DX-B4
      shadow_lane: DX-X1
      example: none
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
        - packages/dotnet/Varlock.Extensions.Hosting/VarlockHostApplicationBuilderExtensions.cs registers IVarlockRuntime and VarlockResolvedGraph via TryAddSingleton after AddVarlock() is called
        - packages/dotnet/Varlock.Extensions.Hosting/VarlockWebApplicationBuilderExtensions.cs delegates to shared RegisterServices method for DI parity
        - internal RegisterServices(IServiceCollection, VarlockConfigurationSource) method is shared between both builder extension types
      proof_artifacts:
        - dotnet test packages/dotnet/Varlock.DotNet.Tests/Varlock.DotNet.Tests.csproj --filter HostingExtensionsTests passes 5 new DI-specific tests
        - tests verify IVarlockRuntime registration, VarlockResolvedGraph factory, TryAdd no-overwrite semantics, null-runtime default to VarlockCliRuntime, and WebApplicationBuilder DI parity
      caveats:
        - DI services use TryAddSingleton to avoid overwriting pre-registered services
        - VarlockResolvedGraph is registered as a factory that lazily resolves from the configuration source's last loaded graph
        - this is singleton-scoped DI only; scoped or transient lifetimes are not supported
    - id: dx-b8-actionable-errors
      owner: Data
      control_lane: DX-B8
      shadow_lane: DX-X1
      example: none
      implementation_status: complete
      proof_status: proven
      checked_artifacts:
