recommended_defaults:
  owner: Picard
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [1245, 1256]
  items:
    - Use the CLI bridge as the only supported semantic engine in v1.
    - Treat engine parity as mandatory and JavaScript-runtime parity as explicitly deferred unless implemented.
    - Prefer a version-pinned executable acquisition model controlled by the .NET package set.
    - Prefer provider-based and options-based application integration over direct static-access APIs.
    - Treat Serilog as the only logging stack with first-class redaction ergonomics in v1 unless broader support is intentionally implemented.
    - Treat repository/file scanning and process-wrapper behavior as out of scope for first-class .NET parity unless explicitly added and documented.
    - Keep generated C# schema-driven and deterministic.
    - Require every user-facing support claim to be proven by an example app or automated test before the initiative is called complete.

repository_hygiene:
  owner: O'Brien
  proposal_refs:
    - path: docs/proposals/dotnet-support.md
      lines: [1258, 1266]
  rules:
    - keep design artifacts centralized under docs/proposals/
    - avoid committing temporary scratch notes or exploratory example fragments outside their final paths
    - place generated files in build output directories, not tracked source paths
    - only add example projects once they are runnable, minimal, and intentionally named
    - avoid fork-specific scaffolding that would need deletion before an upstream pull request

execution_controls:
  issue_required_fields:
    - phase and workstream owner
    - proposal section references
    - ledger IDs touched
    - package or surface area
    - proof artifacts affected
    - examples, tests, and docs required for completion
    - explicit caveats, deferrals, or out-of-scope notes
  pr_required_fields:
    - proposal section references
    - ledger IDs updated or confirmed unchanged
    - phase and workstream owner
    - support claims added, changed, or proven
    - proof artifacts added or advanced
    - example apps, automated tests, and docs updated
    - caveats or deferrals updated
  proof_rule: >-
    A support claim stays planned until the referenced example app and automated
    test both exist, or the ledger explains why one proof form is not applicable.

